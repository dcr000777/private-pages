  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(P.s),iterations:P.n},m,256))}
async function open_(raw){var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},k,u8(P.c)));
  document.open();document.write(html);document.close()}
function saved(){try{var s=JSON.parse(localStorage.getItem(K)||"{}");return s[P.s]?u8(s[P.s]):null}catch(e){return null}}
function save(raw){try{var s=JSON.parse(localStorage.getItem(K)||"{}");s[P.s]=btoa(String.fromCharCode.apply(null,raw));localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
(async function(){var r=saved();if(r){try{await open_(r)}catch(e){}}})();
