  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(P.s),iterations:P.n},m,256))}
async function open_(raw){var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},k,u8(P.c)));
  document.open();document.write(html);document.close()}
/* the key is kept for this tab session always, and on this device when "Remember" is ticked */
function get(st){try{var s=JSON.parse(st.getItem(K)||"{}");return s[P.s]?u8(s[P.s]):null}catch(e){return null}}
function put(st,raw){try{var s={};s[P.s]=btoa(String.fromCharCode.apply(null,raw));st.setItem(K,JSON.stringify(s))}catch(e){}}
function saved(){return get(sessionStorage)||get(localStorage)}
function save(raw,remember){put(sessionStorage,raw);if(remember)put(localStorage,raw)}
(async function(){var r=saved();if(r){try{await open_(r)}catch(e){try{sessionStorage.removeItem(K)}catch(x){}}}})();
document.getElementById("f").addEventListener("submit",async function(e){e.preventDefault();var b=document.getElementById("go"),er=document.getElementById("err");
  b.disabled=true;b.textContent="Opening…";er.textContent="";
  var rem=document.getElementById("rem").checked;
  try{var raw=await keyFrom(document.getElementById("pw").value);save(raw,rem);await open_(raw)}
  catch(x){er.textContent="That password didn't work. Check it and try again.";b.disabled=false;b.textContent="Open"}});
</script></body></html>
