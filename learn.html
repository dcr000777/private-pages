<style>
:root{--bg:#eceef3;--panel:#f7f8fb;--ink:#1c2133;--muted:#5d6479;--line:#c9cdd9;--accent:#b0406a}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding-inline:16px}

p{margin:0;color:var(--muted);font-size:14px}

label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:500 15px system-ui,sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--accent);min-height:1.2em}
</style></head><body>

function u8(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function keyFrom(pw){var m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(P.s),iterations:P.n},m,256))}
async function decrypt(raw){var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},k,u8(P.c)))}
function show(html){document.open();document.write(html);document.close()}
/* the key is kept for this tab session always, and on this device when "Remember" is ticked */
function get(st){try{var s=JSON.parse(st.getItem(K)||"{}");return s[P.s]?u8(s[P.s]):null}catch(e){return null}}
function put(st,raw){try{var s={};s[P.s]=btoa(String.fromCharCode.apply(null,raw));st.setItem(K,JSON.stringify(s))}catch(e){}}
function saved(){return get(sessionStorage)||get(localStorage)}
function save(raw,remember){put(sessionStorage,raw);if(remember)put(localStorage,raw)}
